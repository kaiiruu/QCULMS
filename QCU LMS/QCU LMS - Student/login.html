<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCU LMS - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo-container">
        <img src="image/logo.png" class="logo" alt="Logo">
        <h1 class="brand">QCU LMS</h1>
    </div>
    <nav>
        <ul>
            <li><a href="#">About us</a></li>
            <li><a href="#">Mission</a></li>
            <li><a href="#">Vision</a></li>
            <li><a href="#">Terms and Agreement</a></li>
        </ul>
    </nav>
</header>

<section class="login">
    <div class="overlay"></div>

    <div class="login-card">
        <button class="back-btn" onclick="history.back()">&#9664;</button>

        <h2>Welcome QCIAN!</h2>
        <p class="card-subtitle">Please Log In</p>

        <input type="text" placeholder="Student Number" class="input-field">
        <input type="text" placeholder="User ID" class="input-field">
        <input type="password" placeholder="Password" class="input-field">

        <button class="login-btn" onclick="window.location.href='home.html'">LOG IN</button>
    </div>
</section>

<footer>
    -- QUEZON CITY UNIVERSITY --
</footer>

</body>
</html>
