<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QCU LMS - View Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="viewacc.css">
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <div class="logo">
    <img src="image/logo.png" class="logo-img" alt="QCU Logo">
    <div class="logo-text">QCU <span>LMS</span></div>
  </div>
  <div class="topbar-center">
    <div class="label">View Account</div>
    <div id="datetime" class="datetime"></div>
  </div>
  <div class="topbar-right">
    <div class="notif-btn" title="Notifications">🔔</div>
    <div class="user-pill" title="View Account">
      <div class="avatar">J</div>
      <span>Jheriemy</span>
      <span class="arrow">▾</span>
    </div>
  </div>
</header>

<!-- MAIN CONTENT -->
<div class="page-wrapper">

  <!-- BACK BUTTON -->
  <button class="back-btn" onclick="history.back()" title="Go back">&#9664;</button>

  <!-- PROFILE CARD -->
  <div class="profile-card">

    <!-- EDIT BUTTON -->
    <button class="edit-btn" id="edit-btn" title="Edit profile">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
    </button>

    <div class="card-inner">

      <!-- LEFT COLUMN -->
      <div class="left-col">
        <div class="avatar-wrap">
          <div class="avatar-circle" id="avatar-circle">
            <span class="avatar-initials">JAN</span>
            <img id="avatar-img" src="" alt="" style="display:none;">
          </div>
          <label class="camera-btn" title="Change photo">
            <input type="file" id="photo-input" accept="image/*" style="display:none;">
            📷
          </label>
        </div>

        <div class="field-group">
          <label class="field-label">Student Number</label>
          <div class="field-box" id="field-student-num">24-1234</div>
          <input class="field-input" id="input-student-num" value="24-1234" style="display:none;">
        </div>

        <div class="field-group">
          <label class="field-label">User ID</label>
          <div class="field-box" id="field-user-id">3333-0001</div>
          <input class="field-input" id="input-user-id" value="3333-0001" style="display:none;">
        </div>

        <div class="field-group">
          <label class="field-label">Program</label>
          <div class="field-box" id="field-program">Bachelor of Science in Information Technology</div>
          <input class="field-input" id="input-program" value="Bachelor of Science in Information Technology" style="display:none;">
        </div>
      </div>

      <!-- DIVIDER -->
      <div class="divider"></div>

      <!-- RIGHT COLUMN -->
      <div class="right-col">
        <div class="field-group">
          <label class="field-label">Last Name</label>
          <div class="field-box" id="field-last">ARAULLO</div>
          <input class="field-input" id="input-last" value="ARAULLO" style="display:none;">
        </div>

        <div class="field-group">
          <label class="field-label">First Name</label>
          <div class="field-box" id="field-first">JHERIEMY</div>
          <input class="field-input" id="input-first" value="JHERIEMY" style="display:none;">
        </div>

        <div class="field-group">
          <label class="field-label">Middle Name</label>
          <div class="field-box" id="field-middle">NISNISAN</div>
          <input class="field-input" id="input-middle" value="NISNISAN" style="display:none;">
        </div>

        <div class="field-group">
          <label class="field-label">Year &amp; Section</label>
          <div class="field-box" id="field-year">2nd YEAR SBIT - 2F</div>
          <input class="field-input" id="input-year" value="2nd YEAR SBIT - 2F" style="display:none;">
        </div>
      </div>

    </div><!-- /.card-inner -->

    <!-- EDIT ACTION BUTTONS (hidden by default) -->
    <div class="edit-actions" id="edit-actions" style="display:none;">
      <button class="btn-cancel" id="btn-cancel">Cancel</button>
      <button class="btn-save" id="btn-save">Save Changes</button>
    </div>

  </div><!-- /.profile-card -->

  <!-- ENROLLED CLASSES -->
  <div class="enrolled-section">
    <h3 class="enrolled-title">Enrolled Classes</h3>
    <div class="enrolled-grid">
      <div class="class-chip">CC101</div>
      <div class="class-chip">CC102</div>
      <div class="class-chip">WS101</div>
    </div>
  </div>

</div><!-- /.page-wrapper -->

<script src="viewacc.js"></script>
</body>
</html>
